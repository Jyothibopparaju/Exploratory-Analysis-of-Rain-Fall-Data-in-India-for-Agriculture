<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rainfall Prediction</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #ab2f2f, #a863e0);
            font-family: Arial, sans-serif;
            background-image : url("/static/nochance.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            margin-bottom: auto;
            margin-top: 50px;
            background: lightblue;
            padding: 30px 40px;
            border-radius: 12px;
            text-align: top;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            width: 350px;
            
        }

        h2 {
            color: #38761d;
        }

        p {
            font-size: 18px;
            margin-top: 15px;
            color: #333;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #761d1d;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        a:hover {
            background: #274e13;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>☀ Rainfall Prediction Result</h2>
        <p><strong>No chances of rain today, Enjoy your outing 😊</strong></p>
       

   
    </div>
</body>
</html>
